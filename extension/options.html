<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AboveVTT MCP Bridge</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 16px; padding: 6px 14px; font: inherit; cursor: pointer; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
    #state { margin-top: 20px; padding: 10px 12px; border-radius: 6px; background: #f2f2f2; white-space: pre-wrap; }
    .connected { background: #e6f4ea !important; }
    .bad { background: #fdecea !important; }
  </style>
</head>
<body>
  <h1>AboveVTT MCP Bridge</h1>
  <label for="token">Bridge token</label>
  <input id="token" type="password" autocomplete="off">
  <div class="hint">From <code>%USERPROFILE%\.abovevtt-mcp\bridge-token.txt</code> (created the first time Claude desktop starts the server).</div>
  <label for="port">Port</label>
  <input id="port" type="number" min="1024" max="65535">
  <div class="hint">Leave at 47321 unless you changed AVTT_BRIDGE_PORT.</div>
  <button id="save">Save and connect</button>
  <div id="state">Checking…</div>
  <script src="options.js"></script>
</body>
</html>
